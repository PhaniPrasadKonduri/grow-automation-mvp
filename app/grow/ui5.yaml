specVersion: "3.1"
metadata:
  name: grow-ui

type: application
framework:
  name: OpenUI5
  version: "1.120.12"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.ui.layout
    - name: sap.f
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      configuration:
        baseUri: "http://localhost:4004"
        excludePatterns:
          - "/resources/**"
          - "/test-resources/**"
